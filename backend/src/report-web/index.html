<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CARPRINT · 차량 기록 리포트</title>
    <link rel="stylesheet" href="/assets/viewer.css" />
    <script defer src="/assets/viewer.js"></script>
  </head>
  <body>
    <header><b>CARPRINT</b><span>VEHICLE RECORD</span></header>
    <main>
      <p class="eyebrow">차량 기록 리포트</p>
      <h1 id="heading">공유 상태 확인 중</h1>
      <p id="status" role="status" aria-live="polite">
        최신 열람 권한을 확인합니다.
      </p>
      <div id="report" hidden></div>
      <button id="retry" type="button">다시 확인</button>
    </main>
    <footer>
      시연용 자료 · 서버 수신 확인은 실제 차량 상태의 보증이 아닙니다.
    </footer>
  </body>
</html>
